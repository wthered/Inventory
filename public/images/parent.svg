<!-- Parent Category Placeholder -->
<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
    <!-- Background -->
    <rect width="400" height="300" fill="#f0f4f8" rx="12"/>

    <!-- Border -->
    <rect x="2" y="2" width="396" height="296" fill="none" stroke="#e2e8f0" stroke-width="2" rx="10"/>

    <!-- Icon - Folder/Category Symbol -->
    <rect x="160" y="80" width="80" height="60" fill="#cbd5e1" rx="4"/>
    <rect x="150" y="75" width="100" height="15" fill="#94a3b8" rx="4"/>
    <rect x="155" y="80" width="90" height="60" fill="#cbd5e1" rx="4"/>

    <!-- Arrow/Selection Indicator -->
    <circle cx="200" cy="175" r="25" fill="#64748b" opacity="0.3"/>
    <polygon points="200,160 215,185 185,185" fill="#64748b"/>

    <!-- Text -->
    <text x="200" y="240" font-family="Arial, sans-serif" font-size="16" fill="#475569" text-anchor="middle" font-weight="bold">PARENT CATEGORY</text>
    <text x="200" y="262" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Click to browse products</text>
</svg>